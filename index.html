<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TenTrade Journey Review</title>
<style>
:root{
  --ink:#16141d;--sec:#5e5b6a;--mute:#8b8896;--line:#e3e1ea;--bg:#f5f4f8;--card:#fff;
  --brand:#c2187a;--brand2:#9c1162;--brand-soft:#fbe9f3;--nav:#15121c;--nav2:#211d2b;
  --trigger:#1f8f4e;--send:#c2187a;--wait:#c46a06;--branch:#2563eb;--split:#7c3aed;--webhook:#0f8a8a;--call:#8a4b14;--exit:#6b7280;
  --yes:#1f8f4e;--no:#c0392b;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-w:240px;--drawer-w:440px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--body);padding-left:var(--nav-w)}
a{color:var(--brand2)}
button{font:inherit}

/* ---- left navigation ---- */
.nav{position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);background:var(--nav);color:#fff;display:flex;flex-direction:column;padding:16px 12px;gap:2px;overflow:auto;z-index:30}
.nav .brand{padding:2px 8px 14px;margin-bottom:6px;border-bottom:1px solid #2c2838}
.nav .brand b{display:block;font:700 15px/1.2 var(--body);letter-spacing:.01em}
.nav .brand small{display:block;font-size:10.5px;color:#9a96a8;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.nav .grp{font:700 10px var(--body);text-transform:uppercase;letter-spacing:.09em;color:#7d7990;padding:12px 10px 4px}
.nav a{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:9px;text-decoration:none;color:#cfccd9}
.nav a:hover{background:var(--nav2);color:#fff}
.nav a.on{background:var(--brand);color:#fff}
.nav a .lt{flex:0 0 22px;height:22px;border-radius:6px;background:#2c2838;display:grid;place-items:center;font:700 11.5px var(--body);color:#fff}
.nav a.on .lt{background:rgba(255,255,255,.22)}
.nav a .t{font:600 13px/1.25 var(--body);display:block}
.nav a .s{font-size:10.5px;line-height:1.35;color:#8f8b9e;display:block;margin-top:2px}
.nav a.on .s{color:#f6d3e6}
.nav .foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid #2c2838;font-size:10.5px;line-height:1.5;color:#7d7990}

/* ---- main column ---- */
main{max-width:1060px;margin:0 auto;padding:26px 26px 80px;transition:margin .2s}
body.drawer-open main{margin-right:calc(var(--drawer-w) + 10px)}
.eyebrow{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--brand2)}
h1{font:700 25px/1.2 var(--body);margin:4px 0 6px}
.lede{color:var(--sec);margin:0 0 12px;max-width:820px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px;color:var(--ink)}
.chip b{font-weight:600}
.chip.k{color:var(--sec)}
.chip.seg{background:#eef2ff;border-color:#d7defb}
.chip.goal{background:var(--brand-soft);border-color:#f3c6df;color:var(--brand2);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--sec);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand2);border-color:var(--brand)}
.prose{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 22px 18px}
.prose h3{font:700 16px/1.3 var(--body);margin:20px 0 6px}
.prose h4{font:700 14px/1.3 var(--body);margin:16px 0 4px}
.prose p,.prose li{max-width:860px}
.prose code,.drawer code{font:12.5px var(--mono);background:#f1eff6;border-radius:4px;padding:1px 5px}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{font-weight:700;background:#faf9fc;font-size:12px;color:var(--sec)}

/* ---- flow ---- */
.flowbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--sec)}
.flowbar .legend{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.flowbar .legend span{display:inline-flex;gap:4px;align-items:center}
.flowbar .legend i{font-style:normal;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:11px}
.out{display:inline-flex;align-items:center;gap:5px;font:600 11.5px var(--body);border:1px solid var(--line);border-radius:7px;padding:2px 8px;background:#faf9fc;color:var(--ink);cursor:pointer}
.out:hover{border-color:#8fb0ff;background:#eef3ff}
.out .p{font:700 10px var(--body);color:#fff;border-radius:4px;padding:1px 5px}
.out .p.Y{background:var(--yes)}.out .p.N{background:var(--no)}.out .p.A{background:var(--branch)}.out .p.B{background:var(--split)}
.out .p.out{background:#9b97a8}

/* ---- journey map: Voyager's builder canvas (jb-canvas / jb-node / jb-port / jb-edges) ---- */
main.wide{max-width:none}
.flowbar .legend i{font-style:normal;font-size:13px}
.canvas{position:relative;height:calc(100vh - 120px);min-height:460px;overflow:auto;border:1px solid #e8e8e8;border-radius:12px;
  background-color:#fafafb;background-image:radial-gradient(#d4d4d4 1px,transparent 1px);background-size:18px 18px;cursor:grab;overscroll-behavior:contain}
.canvas.panning{cursor:grabbing;user-select:none}
.canvas.panning .node{pointer-events:none}
.sizer{position:relative;margin:0 auto}
.stage{position:absolute;top:0;left:0;transform-origin:0 0}
.edges{position:absolute;top:0;left:0;z-index:1;overflow:visible}
.edges path{fill:none;stroke:#b6b8c2;stroke-width:2;cursor:pointer;transition:stroke .12s}
.edges path:hover,.edges path.hov{stroke:#8b8fa0;stroke-width:2.5}
.edges path.sel{stroke:var(--brand);stroke-width:2.5}
.edges path.back{stroke-dasharray:6 4}
#stage .node{position:absolute;width:168px;background:#fff;border:1px solid #d4d4d4;border-radius:9px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;user-select:none;transition:border-color .12s,box-shadow .12s}
#stage .node:hover{border-color:#b6b8c2;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#stage .node.sel{border-color:var(--brand);box-shadow:0 0 0 2px rgba(194,24,122,.25)}
#stage .node.hl{border-color:#8fb0ff;box-shadow:0 0 0 3px #e3ebff}
.node .nh{display:flex;align-items:center;gap:7px;padding:8px 11px;font-weight:600;font-size:13px;line-height:1.2;border-bottom:1px solid #e8e8e8}
.node .nh .ic{font-size:13px}
.node .sid{margin-left:auto;font:600 10.5px var(--mono);color:var(--mute);background:#f3f2f6;border-radius:5px;padding:2px 5px}
.node .nb{padding:8px 11px 10px;font-size:12px;line-height:1.4;color:#555;min-height:16px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.node .nb .eid{font:600 10.5px var(--mono);color:var(--brand2);background:var(--brand-soft);border-radius:4px;padding:1px 4px;margin-right:5px}
.node .nb .subj{color:var(--ink)}
.t-trigger .nh{color:var(--trigger)}.t-send .nh{color:var(--send)}.t-wait .nh{color:var(--wait)}.t-branch .nh{color:var(--branch)}
.t-split .nh{color:var(--split)}.t-webhook .nh{color:var(--webhook)}.t-call .nh{color:var(--call)}.t-exit .nh{color:#555}
.port{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--brand);z-index:3;transform:translateX(-50%)}
.port.in{top:-8px;left:50%;border-color:#b6b8c2}
.port.o{bottom:-8px;left:50%;cursor:pointer}
.port.p-Y,.port.p-N,.port.p-A,.port.p-B{width:16px;height:16px;bottom:-9px;font:700 9px/12px var(--body);text-align:center;color:#fff}
.port.p-Y{left:28%;background:var(--yes);border-color:var(--yes)}
.port.p-N{left:72%;background:var(--no);border-color:var(--no)}
.port.p-A{left:28%;background:var(--branch);border-color:var(--branch)}
.port.p-B{left:72%;background:var(--split);border-color:var(--split)}
.port.o:not([data-go]){opacity:.45;cursor:default}
.cwrap{position:relative}
.zoomctl{position:absolute;top:10px;left:10px;z-index:5;display:flex;background:#fff;border:1px solid #e3e1ea;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden;height:30px}
.zoomctl button{border:0;background:none;padding:0 11px;cursor:pointer;color:var(--sec);font-weight:600;font-size:13px;border-right:1px solid #eee}
.zoomctl button:last-child{border-right:0}
.zoomctl button:hover{background:#f5f4f8;color:var(--ink)}

/* email list */
.elist .row{display:grid;grid-template-columns:90px 70px minmax(0,1fr);gap:10px;align-items:baseline;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.elist .row:hover{border-color:#cfcbdc}
.elist .row.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.elist .eid{font:600 12px var(--mono);color:var(--brand2)}
.elist .stp{font:600 11.5px var(--mono);color:var(--mute)}
.elist .s{font-weight:600}
.elist .l{font-size:12px;color:var(--sec)}
.setcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.setcard h3{margin:0 0 2px;font-size:14.5px}
.setcard .meta{font-size:12px;color:var(--sec);margin-bottom:8px}

/* ---- right drawer ---- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer-w);background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(20,16,40,.06);transform:translateX(100%);transition:transform .2s;z-index:40;display:flex;flex-direction:column}
body.drawer-open .drawer{transform:none}
.drawer .dh{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:15px;flex:0 0 32px}
.drawer .dh .tt{font:700 15px/1.2 var(--body)}
.drawer .dh .st{font-size:11.5px;color:var(--mute)}
.drawer .dh .x{border:1px solid var(--line);background:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--sec)}
.drawer .dh .nav2{display:flex;gap:4px}
.drawer .dh .nav2 button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:32px;cursor:pointer;color:var(--sec)}
.drawer .db{overflow:auto;padding:14px 16px 40px;flex:1}
.purpose{font-size:13.5px;line-height:1.5;color:var(--ink);background:var(--brand-soft);border:1px solid #f3c6df;border-radius:10px;padding:10px 12px;margin-bottom:14px}
.purpose span{display:block;font:700 10.5px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--brand2);margin-bottom:3px}
.cfg{margin-bottom:14px}
.cfg h4{font:700 10.5px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--sec);margin:16px 0 8px}
.f{display:block;margin-bottom:9px}
.f>span{display:block;font:700 10.5px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-bottom:3px}
.ctl{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fbfafd;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.ctl.sel::after{content:"▾";color:var(--mute)}
.cond{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:#fff}
.cond .ctl{margin-bottom:5px}
.cond .ctl:last-child{margin-bottom:0}
.cond .note{font-size:11.5px;color:var(--sec);margin-top:4px}
.hint{font-size:12px;color:var(--sec);margin:6px 0}
.btnrow{display:flex;gap:6px;margin:8px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:not-allowed;opacity:.75}
.conn{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--sec)}
.kv dd{margin:0;font-weight:600}
.why{font-size:12px;color:#6b5426;background:#fdf9f1;border:1px solid #f0e2c9;border-left:3px solid #c9862b;border-radius:6px;padding:7px 9px;margin:8px 0}

/* email preview */
.mail{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px;background:#f3f2f6}
.mail .mh{background:#fff;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.mail .mh div{margin:1px 0}
.mail .mh .k{color:var(--mute);display:inline-block;width:70px}
.mail .mh .subj{font-weight:700}
.mail .mh .pre{color:var(--sec)}
.mail .mb{background:#fff;margin:12px;border-radius:8px;padding:16px 18px;font-size:13.5px;line-height:1.6}
.mail .logo{font:800 15px var(--body);color:var(--brand);margin-bottom:12px;letter-spacing:.01em}
.mail .mb p{margin:0 0 10px}
.mail .mb ul,.mail .mb ol{margin:0 0 10px;padding-left:20px}
.mail .cta{display:inline-block;background:var(--brand);color:#fff;font-weight:700;border-radius:7px;padding:9px 16px;margin:6px 0 4px;text-decoration:none}
.mail .cta-t{font-size:11px;color:var(--mute);margin-bottom:6px}
.mail .mf{margin:0 12px 12px;padding:10px 6px;font-size:10.5px;line-height:1.5;color:var(--mute)}
.mail .tok{background:#fff3c4;border-radius:3px;padding:0 3px;font-family:var(--mono);font-size:12px}
.src{font-size:12px;color:var(--sec)}
.src ul{padding-left:18px;margin:4px 0}
.empty{color:var(--sec);border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center}

@media(max-width:1180px){body.drawer-open main{margin-right:auto}}
@media(max-width:900px){
  body{padding-left:0}
  .nav{position:static;width:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px}
  .nav .brand{border:0;margin:0;padding:0 10px 0 0}
  .nav .grp,.nav a .s,.nav .foot{display:none}
  .nav a{white-space:nowrap}
  main{padding:18px 14px 60px}
  :root{--drawer-w:100vw}
}

/* ---- section navigation ---- */
.nav a.sec{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;text-decoration:none;color:#e6e3ee;margin-top:2px}
.nav a.sec:hover{background:var(--nav2)}
.nav a.sec .si{flex:0 0 24px;height:24px;border-radius:7px;background:#2c2838;display:grid;place-items:center;font-size:13px}
.nav a.sec.open{background:#221d2d}
.nav a.sec.open .si{background:var(--brand)}
.nav a.sec .t{font:700 13.5px/1.25 var(--body)}
.nav .items{margin:2px 0 8px 12px;padding-left:8px;border-left:1px solid #2c2838}
.nav .items a.it{padding:6px 9px}
.nav .items .lt{flex:0 0 20px;height:20px;font-size:10.5px}
.pager{display:flex;justify-content:space-between;gap:12px;margin:22px 0 0}
.pager a{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;text-decoration:none;font-weight:600}
.pager a:hover{border-color:var(--brand)}
.embed{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.embed iframe{display:block;width:100%;height:calc(100vh - 190px);min-height:520px;border:0}
.prose img,.mail .mb img{max-width:100%;height:auto;border-radius:12px;display:block;margin:6px 0}

/* ---- backlog board (from the Credo staging-plan board) ---- */
.bl-status{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 14px}
.bl-status .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex:1 1 170px}
.bl-status .card.state{flex:3 1 360px;border-left:4px solid #b45309}
.bl-status small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.bl-status b{font-size:15.5px}
.bl-warn{background:#fdecec;border:1px solid #f3c6c9;color:#b42318;border-radius:10px;padding:9px 13px;margin-bottom:12px;font-weight:600}
.bl-legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12.5px;color:var(--sec);margin:0 0 12px}
.pill{display:inline-block;font:700 10.5px/1.7 var(--body);text-transform:uppercase;letter-spacing:.04em;padding:0 7px;border-radius:5px;color:#fff;white-space:nowrap;font-style:normal}
.by-panui{background:#2563eb}.by-us{background:var(--brand)}.by-both{background:#7c3aed}.by-decision{background:#b45309}
.pill.blk{background:#fdecec;color:#b42318;border:1px solid #f3c6c9}
.ref{display:inline-block;font:600 11px/1.6 var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.board{display:grid;grid-template-columns:minmax(260px,1.4fr) 1fr .7fr .7fr minmax(200px,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.board .hd{background:var(--nav);color:#fff;font:700 11.5px/1 var(--body);text-transform:uppercase;letter-spacing:.05em;padding:11px 12px}
.board .hd.doing{background:#b45309}
.board .hd em{font-style:normal;font-weight:400;opacity:.75;text-transform:none;letter-spacing:0}
.board .grp-row{grid-column:1/-1;background:#f3f1f8;border-top:1px solid var(--line);padding:12px 14px}
.board .grp-row b{font-size:14.5px}
.board .grp-row .gdesc{font-size:13px;color:var(--sec);margin-top:4px;max-width:980px}
.board .grp-row .gdesc p{margin:4px 0}
.board .cell{padding:10px 12px;border-top:1px solid var(--line);min-width:0}
.board .cell.col{border-left:1px solid var(--line)}
.board .row-active{background:#fff4e5}.board .row-done{background:#f2f7f3}
.pbi .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.pbi .id{font:700 12px var(--mono);color:var(--mute)}
.pbi .ttl{font-weight:700;font-size:14.5px;line-height:1.3;margin:2px 0 4px}
.pbi .pwhy{font-size:12.5px;color:var(--sec);margin:0 0 6px}
.pbi details{font-size:12.5px}
.pbi summary{cursor:pointer;color:var(--brand2);font-weight:600}
.pbi .dod{margin:6px 0 0;padding:7px 9px;background:#f6f4fa;border-radius:7px}
.task{font-size:12.5px;line-height:1.35;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 8px;margin:0 0 6px}
.col-doing .task{border-color:#e8b77a;background:#fff9f0}
.col-done .task{color:var(--mute);text-decoration:line-through}
.col .lbl{display:none}
.col-review .rv{font-size:12px;line-height:1.4;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff}
.col-review .rv .s{color:var(--sec)}
@media(max-width:1000px){
  .board{display:block}.board .hd{display:none}.board .cell{border-left:none!important}
  .board .cell.pbi{border-top:3px solid var(--nav)}
  .col .lbl{display:block;font:700 10.5px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-bottom:5px}
  .col.empty{display:none}
}

/* ---- birthday calendar ---- */
.el-fire{--el:#f0663c;--el-soft:#fde7df}.el-earth{--el:#2f9a6a;--el-soft:#dff3e9}.el-air{--el:#5b7fe0;--el-soft:#e3e9fb}.el-water{--el:#2a6fc9;--el-soft:#dceafa}.el-x{--el:#999;--el-soft:#eee}
.bd-legend{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}
.bd-legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--el-soft);border-radius:20px;padding:3px 10px 3px 4px}
.bd-legend i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--el);color:#fff;display:grid;place-items:center;font-size:12px}
.bd-legend small{color:var(--sec)}
.bd-cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:10px 0 20px}
.bd-month{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bd-month h4{margin:0 0 8px;font-size:13.5px}
.bd-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.bd-day{position:relative;border:0;border-radius:7px;background:var(--el-soft);color:#222;font:600 12px var(--body);height:28px;cursor:pointer;padding:0}
.bd-day:hover{outline:2px solid var(--el)}
.bd-day.smp{background:var(--el);color:#fff}
.bd-day.smp i{position:absolute;top:-6px;right:-4px;font-style:normal;font-size:11px;color:#f5b301;text-shadow:0 0 2px #fff}
.bd-day.sel{outline:3px solid var(--ink)}

/* review mode: the widget adds a 46px banner on top and a 330px comment sidebar on the right */
html[data-review-mode="on"] .nav{top:46px}
html[data-review-mode="on"] body{padding-right:330px}
html[data-review-mode="on"] .drawer{top:46px;right:330px}
html[data-review-mode="on"] body.drawer-open main{margin-right:calc(var(--drawer-w) + 10px)}
@media(max-width:1500px){html[data-review-mode="on"]{--drawer-w:380px}}
@media(max-width:900px){html[data-review-mode="on"] body{padding-right:0}html[data-review-mode="on"] .drawer{right:0}}
</style>
</head>
<body>
<nav class="nav" id="nav" aria-label="Journeys"></nav>
<main id="main"></main>
<aside class="drawer" id="drawer" aria-label="Step setup">
  <div class="dh" id="dh"></div>
  <div class="db" id="db"></div>
</aside>
<script src="review.config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="review-bootstrap.js"></script>
</body>
</html>
