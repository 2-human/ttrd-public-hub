<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Protected</title>
<style>
:root{--bg:#f5f4f8;--card:#fff;--ink:#16141d;--mute:#5e5b6a;--line:#e3e1ea;--accent:#16141d;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#141318;--card:#1d1b23;--ink:#ecebf0;--mute:#a19eab;--line:#2f2c38;--accent:#ecebf0;--err:#ff6b5e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.gate{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 26px}
h1{margin:0 0 6px;font-size:18px}
p{margin:0 0 22px;font-size:13.5px;line-height:1.5;color:var(--mute)}
form{display:flex;flex-direction:column;gap:10px}
input{padding:11px 12px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{padding:11px 14px;font:inherit;font-weight:600;font-size:14px;border:0;border-radius:8px;background:var(--accent);color:var(--card);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:18px;margin-top:10px;font-size:13px;color:var(--err)}
</style>
</head>
<body>
<main class="gate">
  <h1>Protected page</h1>
  <p>This page is encrypted. Enter the password you were given.</p>
  <form id="f">
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" aria-label="Password" required autofocus>
    <button type="submit" id="b">Unlock</button>
  </form>
  <div class="err" id="e" role="alert"></div>
</main>
