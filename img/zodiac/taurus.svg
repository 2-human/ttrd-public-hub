<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Taurus trading personality card: The Comfort-Zone Bull">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fa66b"/><stop offset="1" stop-color="#1f6f78"/></linearGradient>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff}
.kick{font-size:12px;font-weight:700;letter-spacing:2px;opacity:.85}
.sign{font-size:16px;font-weight:600;opacity:.9}
.nick{font-size:30px;font-weight:800}
.joke{font-size:15px;font-style:italic;opacity:.95}
.lbl{font-size:12.5px;font-weight:600;opacity:.92}
.val{font-size:12px;font-weight:700;text-anchor:end;opacity:.9}
.glyph{font-size:118px;text-anchor:middle}
.prop{font-size:46px;text-anchor:middle}
.foot{font-size:11px;opacity:.8}
.brand{font-size:14px;font-weight:800;letter-spacing:.5px;text-anchor:end}
</style>
</defs>
<rect width="600" height="400" rx="22" fill="url(#g)"/>
<circle cx="125" cy="170" r="92" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
<text x="125" y="210" class="glyph">♉︎</text>
<circle cx="190" cy="250" r="34" fill="#fff"/>
<text x="190" y="266" class="prop">🐂</text>
<text x="250" y="48" class="kick">YOUR TRADING PERSONALITY</text>
<text x="250" y="72" class="sign">Taurus · 20 Apr – 20 May</text>
<text x="250" y="104" class="nick">The Comfort-Zone</text><text x="250" y="138" class="nick">Bull</text>
<text x="250" y="180" class="joke">Treats a trading plan like a</text><text x="250" y="200" class="joke">favourite restaurant: same table,</text><text x="250" y="220" class="joke">every time.</text>
<text x="250" y="301" class="lbl">Love of routine</text><rect x="410" y="292" width="150" height="10" rx="5" fill="rgba(255,255,255,.22)"/><rect x="410" y="292" width="150" height="10" rx="5" fill="#fff"/><text x="572" y="301" class="val">10</text><text x="250" y="323" class="lbl">Patience</text><rect x="410" y="314" width="150" height="10" rx="5" fill="rgba(255,255,255,.22)"/><rect x="410" y="314" width="135" height="10" rx="5" fill="#fff"/><text x="572" y="323" class="val">9</text><text x="250" y="345" class="lbl">Snack breaks</text><rect x="410" y="336" width="150" height="10" rx="5" fill="rgba(255,255,255,.22)"/><rect x="410" y="336" width="120" height="10" rx="5" fill="#fff"/><text x="572" y="345" class="val">8</text><text x="250" y="367" class="lbl">Wish to change chairs</text><rect x="410" y="358" width="150" height="10" rx="5" fill="rgba(255,255,255,.22)"/><rect x="410" y="358" width="15" height="10" rx="5" fill="#fff"/><text x="572" y="367" class="val">1</text>
<text x="32" y="378" class="foot">Just for fun. Not trading advice.</text>
<text x="568" y="378" class="brand">TenTrade</text>
</svg>
